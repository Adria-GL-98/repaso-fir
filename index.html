<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso FIR</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repaso FIR">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2c5fa8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#1c1e23; --muted:#6a6f78; --line:#e2e0da;
  --accent:#2c5fa8; --accent-ink:#ffffff;
  --ok:#1d7a4c; --ok-bg:#e2f2e9; --bad:#b4372f; --bad-bg:#fbe6e3; --warn:#8a5a00; --warn-bg:#fcefd2;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --card:#1d2026; --ink:#eceef1; --muted:#9aa1ab; --line:#2d3139;
    --accent:#7aa7e0; --accent-ink:#0c1522;
    --ok:#5fc490; --ok-bg:#15301f; --bad:#ee7d74; --bad-bg:#3a1b19; --warn:#e6b65c; --warn-bg:#352a12;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;font-size:17px}
.logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:800}
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{border:0;background:transparent;color:var(--muted);font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer}
.tab.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px;letter-spacing:-.01em}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
select,textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.big{width:100%;padding:14px;font-size:16px;margin-top:6px}
.btn.small{font-size:13px;padding:6px 10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats.four{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sesbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.link{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.enun{font-size:18px;line-height:1.5;margin:0 0 16px;font-weight:500}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font-size:16px;line-height:1.4;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--line);margin-top:-1px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .num{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px;border-radius:12px;background:var(--bg)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb p{margin:4px 0;font-size:14px;color:var(--muted)}
.nota{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--card);border-radius:0 8px 8px 0;font-size:14px}
.aviso{margin-top:10px;font-size:13px;color:var(--warn)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.pips{display:inline-flex;gap:3px;flex:none}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--ok)}
.subj{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.subj .bar{grid-column:1/-1;height:5px}
.subj .bar i{background:var(--ok)}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);font-size:14px;cursor:pointer;border-radius:6px}
.qrow:hover{background:var(--bg)}
.qrow .n{flex:none;font-weight:600;width:38px;color:var(--muted);font-variant-numeric:tabular-nums}
.qrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;font-size:12px;padding:3px 9px;cursor:pointer;color:var(--muted)}
.star.on{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600}
.archivo summary{font-size:15px;font-weight:600;color:var(--ink)}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;margin-bottom:6px}
.seg button{border:0;background:none;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:600}
.center{text-align:center}
.big{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.steps{padding-left:20px;margin:0 0 6px;font-size:14px}
.steps li{margin-bottom:6px}
details{margin:6px 0 14px}
summary{cursor:pointer;font-size:14px;color:var(--accent)}
pre.prompt{white-space:pre-wrap;font-size:12.5px;max-height:320px;overflow:auto;background:var(--bg);padding:12px;border-radius:10px;border:1px solid var(--line);margin:8px 0 0}
.res{font-size:14px;padding:12px;border-radius:10px;background:var(--bg);margin-top:8px}
.res ul{margin:6px 0 0;padding-left:18px}
.res.err{background:var(--bad-bg);color:var(--bad)}
.exrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.exrow .hint{display:block;margin:2px 0 0}
.exbtns{display:flex;gap:6px}
.banner{background:var(--warn-bg);color:var(--warn);font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:14px}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){
  .top{padding:10px 12px}
  .enun{font-size:17px}
  .stat b{font-size:22px}
  .stats.four{grid-template-columns:repeat(2,1fr)}
  .kbd{display:none}
}
</style>
</head>

</header>

<script type="text/plain" id="prompt-extraccion">
Te paso fotos de un examen tipo test del FIR ya corregido a mano. Necesito que transcribas las preguntas a JSON para importarlas en mi app de repaso.

ANTES DE EMPEZAR
- Si en las fotos no se ve claramente el nombre del examen (cabecera del cuadernillo u hoja de respuestas), pregúntame cómo se llama antes de transcribir nada. El nombre tiene que ser idéntico en todas las tandas del mismo examen, porque la app junta las preguntas por ese nombre.

CÓMO ESTÁ CORREGIDO
- Tick rojo junto al número de la pregunta → acertada.
- Círculo azul en una opción → la respuesta que marcó la alumna.
- Círculo rojo en una opción → la respuesta correcta (aparece cuando la azul es incorrecta o cuando la pregunta se dejó en blanco).
- Pregunta sin respuesta azul, o con una "B" junto al número en la hoja de respuestas → en blanco. Las preguntas en blanco cuentan como errores a efectos de repaso.
- Subrayados, fluorescentes y notas a mano son apuntes de estudio, no respuestas.

MÉTODO DE TRABAJO (el que da menos errores)
1. Si hay foto de la hoja de respuestas, empieza por ella: es la fuente de verdad para saber qué marcó (X azul) y cuál era la correcta (X roja), qué filas tienen tick (acertadas) y cuáles tienen "B" (en blanco). Apunta el recuento total que suele estar escrito abajo (aciertos, errores, blancos).
2. Recorre el cuadernillo página a página y columna a columna, de arriba abajo. Si las fotos tienen poca resolución, amplía mentalmente cada columna por separado en lugar de leer la página entera de golpe.
3. Copia el texto de cada pregunta del cuadernillo y la respuesta marcada y la correcta de la hoja de respuestas.
4. Si el cuadernillo y la hoja no coinciden (por ejemplo, tick en el cuadernillo pero fallo en la hoja), manda la hoja: pon "dudosa": true, explica la discrepancia en "nota" y añade el número a "revisar".
5. Las preguntas que empiezan al final de una columna o página y siguen en la siguiente se unen en una sola.
6. Al terminar, cuenta acertadas, incorrectas y en blanco y compáralo con el recuento de la hoja. Si no cuadra, revisa primero las filas de la hoja sin tick ni "B" y anota en "revisar" las que sigan sin estar claras.

QUÉ EXTRAER
Todas las preguntas que aparezcan en las fotos de este mensaje: acertadas, incorrectas y en blanco. Si te digo «solo errores», extrae únicamente las incorrectas y las en blanco. Las de reserva (201–210) inclúyelas también, empezando su enunciado por "[Reserva] ".

FORMATO DE SALIDA
Devuelve únicamente un bloque de código JSON válido, sin texto antes ni después, con esta estructura:

{
  "examen": "farmaFIR · Examen Final 1 (2021)",
  "fecha": "2026-09-13",
  "preguntas": [
    {
      "n": 61,
      "asignatura": "Análisis clínicos y hematología",
      "enunciado": "¿Qué destacaría del siguiente hemograma: ...?",
      "opciones": ["Linfopenia.", "Eosinofilopenia.", "Neutropenia.", "Neutrofilia."],
      "correcta": 4,
      "marcada": null,
      "estado": "blanco",
      "nota": "Neutrófilos normales ≈ 4.000/µL (~65 %)"
    }
  ],
  "revisar": []
}

REGLAS DE CADA CAMPO
- "examen": el nombre del examen (ver ANTES DE EMPEZAR).
- "fecha": la de la hoja de respuestas (AAAA-MM-DD) si aparece; si no, omítela.
- "n": número de la pregunta (entero).
- "enunciado" y "opciones": transcripción literal, sin el número de pregunta ni el de opción, con acentos, y subíndices o superíndices en texto plano (CO2, pKa, Ca2+, t1/2).
- "correcta" y "marcada": número de opción (1–4). "marcada" es null si está en blanco.
- "estado": "correcta", "incorrecta" o "blanco".
- "asignatura": elige UNA de esta lista: Farmacología, Farmacia clínica y atención farmacéutica, Bioquímica, Biología molecular y genética, Fisiología, Fisiopatología, Inmunología, Microbiología, Parasitología, Química orgánica, Química farmacéutica, Química analítica y técnicas instrumentales, Fisicoquímica, Tecnología farmacéutica, Biofarmacia y farmacocinética, Farmacognosia y fitoterapia, Toxicología, Análisis clínicos y hematología, Nutrición y bromatología, Bioestadística, Salud pública, Legislación y gestión farmacéutica.
- "nota": resume las anotaciones a mano que ayuden a recordar la respuesta (mnemotecnias, aclaraciones). Si no hay, omite el campo. No añadas explicaciones tuyas.
- "relevante": true solo si junto a la pregunta hay una marca a mano de duda o importancia (OJO, interrogante, estrella). Si no, omite el campo.
- "dudosa": true solo si algo no se lee bien o no está claro; si no, omite el campo.
- Si la pregunta depende de una fórmula o dibujo, descríbelo entre corchetes dentro del enunciado.
- No inventes nada. Si algo es ilegible escribe [ilegible], pon "dudosa": true y añade el número a "revisar".
</script>

<script>
(function(){
'use strict';
var KEY='repaso-fir-v1', DOMINIO=3;
var ORIGINAL='<!doctype html>\n'+document.documentElement.outerHTML;
var storageOK=true;

function cargar(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){storageOK=false;return null}}
var db=cargar()||{};
db.version=1; db.preguntas=db.preguntas||{}; db.progreso=db.progreso||{}; db.seeds=db.seeds||[];
db.cfg=Object.assign({examen:'*',asig:'*',conjunto:'pendientes',tam:20,orden:'prioridad'},db.cfg||{});
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(e){storageOK=false}}

var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function slug(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'examen'}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2600)}
var PROMPT=($('#prompt-extraccion')||{}).textContent||'';PROMPT=PROMPT.trim();

function nuevoProg(){return {box:0,intentos:0,aciertos:0,racha:0,ultima:0,hist:[]}}
function prog(id){if(!db.progreso[id]){var p=db.preguntas[id];db.progreso[id]=nuevoProg(p&&p.estado)}return db.progreso[id]}
function dominada(id){return prog(id).box>=DOMINIO}
function principal(p){return p.estado!=='correcta'||!!prog(p.id).relevante}
function todas(){return Object.keys(db.preguntas).map(function(k){return db.preguntas[k]})}
function examenes(){var s={};todas().forEach(function(p){s[p.examen]=1});return Object.keys(s).sort(function(a,b){return a.localeCompare(b,'es')})}
function asignaturas(ex){var s={};todas().forEach(function(p){if(ex==='*'||p.examen===ex)s[p.asignatura]=1});return Object.keys(s).sort(function(a,b){return a.localeCompare(b,'es')})}
function stats(lista){var r={total:lista.length,dom:0,pend:0,intentos:0,aciertos:0};lista.forEach(function(p){var g=prog(p.id);if(g.box>=DOMINIO)r.dom++;else r.pend++;r.intentos+=g.intentos;r.aciertos+=g.aciertos});return r}

/* ---------- Importación ---------- */
function idx(v,len){
  if(v==null||v==='')return null;
  if(typeof v==='string'){var s=v.trim().toUpperCase();if(/^[A-H]$/.test(s))return s.charCodeAt(0)-64;v=parseInt(s,10)}
  return (Number.isInteger(v)&&v>=1&&v<=len)?v:NaN;
}
function extraerJSON(texto){
  texto=String(texto||'').trim();
  if(!texto)throw new Error('No hay nada que importar.');
  try{return JSON.parse(texto)}catch(e){}
  var a=texto.search(/[\[{]/), b=Math.max(texto.lastIndexOf('}'),texto.lastIndexOf(']'));
  if(a>=0&&b>a){try{return JSON.parse(texto.slice(a,b+1))}catch(e){throw new Error('El JSON no es válido: '+e.message)}}
  throw new Error('No encuentro ningún JSON en el texto.');
}
function importar(obj,res){
  res=res||{nuevas:0,actualizadas:0,errores:[],revisar:[]};
  if(Array.isArray(obj)){obj.forEach(function(o){importar(o,res)});return res}
  if(!obj||typeof obj!=='object'){res.errores.push('Formato no reconocido.');return res}
  if(obj.tipo==='repaso-fir-copia'&&obj.db){
    var d=obj.db, id;
    for(id in (d.preguntas||{})){if(db.preguntas[id])res.actualizadas++;else res.nuevas++;db.preguntas[id]=d.preguntas[id]}
    for(id in (d.progreso||{})){var a=db.progreso[id],b=d.progreso[id];if(!a||(b.ultima||0)>(a.ultima||0))db.progreso[id]=b}
    return res;
  }
  if(!Array.isArray(obj.preguntas)){res.errores.push('Falta la lista "preguntas".');return res}
  var examen=String(obj.examen||'Examen sin nombre').trim();
  obj.preguntas.forEach(function(p,i){
    var et='Pregunta '+(p&&p.n!=null?p.n:'#'+(i+1));
    if(!p||typeof p!=='object'){res.errores.push(et+': no es un objeto.');return}
    var n=parseInt(p.n,10);
    var ops=Array.isArray(p.opciones)?p.opciones.map(function(o){return String(o).trim()}):[];
    if(!isFinite(n)){res.errores.push(et+': falta "n".');return}
    if(!p.enunciado){res.errores.push(et+': falta "enunciado".');return}
    if(ops.length<2){res.errores.push(et+': necesita al menos 2 opciones.');return}
    var c=idx(p.correcta,ops.length);
    if(!c){res.errores.push(et+': "correcta" no es válida.');return}
    var m=idx(p.marcada,ops.length);if(m!==m)m=null;
    var estado=String(p.estado||'').toLowerCase();
    if(['incorrecta','blanco','correcta'].indexOf(estado)<0)estado=m==null?'blanco':(m===c?'correcta':'incorrecta');
    var id=slug(examen)+'#'+n, existe=!!db.preguntas[id];
    db.preguntas[id]={id:id,examen:examen,fecha:obj.fecha||'',n:n,asignatura:String(p.asignatura||'').trim()||'Sin asignatura',
      enunciado:String(p.enunciado).trim(),opciones:ops,correcta:c,marcada:m,estado:estado,nota:p.nota?String(p.nota).trim():'',dudosa:!!p.dudosa};
    if(!db.progreso[id])db.progreso[id]=nuevoProg(estado);
    if(p.relevante===true)prog(id).relevante=true;
    if(existe)res.actualizadas++;else res.nuevas++;
    if(p.dudosa&&res.revisar.indexOf(n)<0)res.revisar.push(n);
  });
  if(Array.isArray(obj.revisar))obj.revisar.forEach(function(n){if(res.revisar.indexOf(n)<0)res.revisar.push(n)});
  return res;
}
(function semilla(){
  try{
    var el=$('#datos-incrustados'),txt=el?el.textContent.trim():'';
    if(!txt)return;var h=hash(txt);
    if(db.seeds.indexOf(h)<0){importar(JSON.parse(txt));db.seeds.push(h);guardar()}
  }catch(e){console.warn('Datos incrustados no válidos',e)}
})();

/* ---------- Sesión ---------- */
var archAbierto=false, vista='practicar', sess=null, progEx='*', progVer='pendientes', ultimoImport=null, impTxt='';

function filtrar(cfg){
  return todas().filter(function(p){
    if(cfg.examen!=='*'&&p.examen!==cfg.examen)return false;
    if(cfg.asig!=='*'&&p.asignatura!==cfg.asig)return false;
    var g=prog(p.id);
    switch(cfg.conjunto){
      case 'pendientes':return principal(p)&&g.box<DOMINIO;
      case 'examen':return principal(p);
      case 'acertadas':return p.estado==='correcta';
      case 'fallos':return g.intentos>0&&g.racha===0;
      default:return true;
    }
  });
}
function ordenar(l,orden){
  if(orden==='numero')return l.sort(function(a,b){return a.examen.localeCompare(b.examen)||a.n-b.n});
  var r={};l.forEach(function(p){r[p.id]=Math.random()});
  if(orden==='aleatorio')return l.sort(function(a,b){return r[a.id]-r[b.id]});
  return l.sort(function(a,b){var A=prog(a.id),B=prog(b.id);return (A.box-B.box)||(A.ultima-B.ultima)||(r[a.id]-r[b.id])});
}
function empezar(ids){
  ids=ids.filter(function(id){return db.preguntas[id]});
  if(!ids.length){toast('No hay preguntas con ese filtro');return}
  sess={cola:ids.slice(),i:0,resp:null,primero:{},reins:{},fin:false};
  vista='practicar';render();window.scrollTo(0,0);
}
function barajar(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function ordenOpciones(p){
  if(!sess.ord||sess.ordI!==sess.i){
    sess.ordI=sess.i;
    var fijo=/anterior|todos ellos|todas ellas|ninguna de las|ninguno de los|todas son|todos son/i;
    var mov=[],res=[];
    p.opciones.forEach(function(o,j){if(!fijo.test(o))mov.push(j+1)});
    mov=barajar(mov);
    p.opciones.forEach(function(o,j){res.push(fijo.test(o)?j+1:mov.shift())});
    sess.ord=res;
  }
  return sess.ord;
}
function responder(k){
  if(!sess||sess.fin||sess.resp!=null)return;
  var id=sess.cola[sess.i],p=db.preguntas[id];if(!p)return;
  var ok=k===p.correcta;sess.resp=k;
  var g=prog(id);g.intentos++;g.ultima=Date.now();
  if(ok){g.aciertos++;g.racha++;g.box=Math.min(g.box+1,DOMINIO+1)}else{g.racha=0;g.box=0}
  g.hist.push(ok?1:0);if(g.hist.length>20)g.hist.shift();
  if(!(id in sess.primero))sess.primero[id]=ok;
  if(!ok&&!sess.reins[id]){sess.reins[id]=1;sess.cola.splice(Math.min(sess.i+5,sess.cola.length),0,id)}
  guardar();render();
}
function siguiente(){
  if(!sess||sess.resp==null)return;
  sess.i++;sess.resp=null;
  while(sess.i<sess.cola.length&&!db.preguntas[sess.cola[sess.i]])sess.i++;
  if(sess.i>=sess.cola.length)sess.fin=true;
  render();window.scrollTo(0,0);
}

/* ---------- Vistas ---------- */
function opt(v,label,cur){return '<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+esc(label)+'</option>'}
function pips(id){var b=Math.min(prog(id).box,DOMINIO),h='<span class="pips" title="'+b+' de '+DOMINIO+'">';for(var k=1;k<=DOMINIO;k++)h+='<i class="'+(k<=b?'on':'')+'"></i>';return h+'</span>'}
function estrella(p){if(p.estado!=='correcta')return '';var on=!!prog(p.id).relevante;
  return '<button class="star'+(on?' on':'')+'" data-a="rel" data-id="'+esc(p.id)+'" title="Las relevantes salen con los errores">'+(on?'★ Relevante':'☆ Relevante')+'</button>'}
function fila(p){return '<div class="qrow" data-a="una" data-id="'+esc(p.id)+'" role="button" tabindex="0"><span class="n">'+p.n+'</span><span class="t">'+esc(p.enunciado)+'</span>'+estrella(p)+pips(p.id)+'</div>'}
function chipEstado(p){
  if(p.estado==='incorrecta')return '<span class="chip bad">Fallada en el examen</span>';
  if(p.estado==='blanco')return '<span class="chip bad">En blanco en el examen (cuenta como error)</span>';
  return '<span class="chip ok">Acertada en el examen</span>';
}
function vacio(){return '<section class="card center"><h2>Aún no hay preguntas</h2><p class="hint">Ve a <b>Datos</b> para importar las preguntas de un examen.</p><div class="btnrow" style="justify-content:center"><button class="btn primary" data-a="go" data-v="datos">Ir a Datos</button></div></section>'}

function vSetup(){
  var exs=examenes();if(!exs.length)return vacio();
  var c=db.cfg;
  if(c.examen!=='*'&&exs.indexOf(c.examen)<0)c.examen='*';
  var asigs=asignaturas(c.examen);if(c.asig!=='*'&&asigs.indexOf(c.asig)<0)c.asig='*';
  var delEx=todas().filter(function(p){return c.examen==='*'||p.examen===c.examen});
  var s=stats(delEx.filter(principal)), nArch=delEx.filter(function(p){return p.estado==='correcta'&&!prog(p.id).relevante}).length;
  var disp=filtrar(c).length, n=c.tam>0?Math.min(disp,c.tam):disp;
  return '<section class="card"><div class="stats">'+
      '<div class="stat"><b>'+s.pend+'</b><span>Pendientes</span></div>'+
      '<div class="stat"><b>'+s.dom+'</b><span>Dominadas</span></div>'+
      '<div class="stat"><b>'+s.total+'</b><span>Errores y relevantes</span></div></div>'+
      (nArch?'<p class="hint">Además hay '+nArch+' acertadas guardadas aparte (archivo).</p>':'')+'</section>'+
    '<section class="card"><h2>Nueva sesión</h2>'+
      '<label>Examen<select data-cfg="examen">'+opt('*','Todos',c.examen)+exs.map(function(e){return opt(e,e,c.examen)}).join('')+'</select></label>'+
      '<label>Asignatura<select data-cfg="asig">'+opt('*','Todas',c.asig)+asigs.map(function(a){return opt(a,a,c.asig)}).join('')+'</select></label>'+
      '<label>Qué preguntas<select data-cfg="conjunto">'+
        opt('pendientes','Errores pendientes (sin dominar)',c.conjunto)+
        opt('examen','Todos los errores, blancos y relevantes',c.conjunto)+
        opt('fallos','Falladas la última vez que salieron',c.conjunto)+
        opt('acertadas','Acertadas en el examen (archivo)',c.conjunto)+
        opt('todas','Todas',c.conjunto)+'</select></label>'+
      '<div class="row2"><label>Cuántas<select data-cfg="tam">'+opt(10,'10',c.tam)+opt(20,'20',c.tam)+opt(40,'40',c.tam)+opt(0,'Todas',c.tam)+'</select></label>'+
      '<label>Orden<select data-cfg="orden">'+opt('prioridad','Las más flojas primero',c.orden)+opt('aleatorio','Aleatorio',c.orden)+opt('numero','Por número',c.orden)+'</select></label></div>'+
      '<button class="btn primary big" data-a="empezar"'+(n?'':' disabled')+'>'+(n?'Empezar · '+n+' pregunta'+(n===1?'':'s'):'No hay preguntas con este filtro')+'</button>'+
      '<p class="hint">Las opciones salen en orden aleatorio cada vez. Las que falles vuelven a salir más adelante en la misma sesión. Una pregunta queda dominada con '+DOMINIO+' aciertos seguidos; si la fallas, vuelve a pendientes.</p>'+
    '</section>';
}

function vPregunta(){
  while(sess.i<sess.cola.length&&!db.preguntas[sess.cola[sess.i]])sess.i++;
  if(sess.i>=sess.cola.length){sess.fin=true;return vResumen()}
  var id=sess.cola[sess.i],p=db.preguntas[id],g=prog(id),r=sess.resp,total=sess.cola.length;
  var hecho=sess.i+(r!=null?1:0);
  var ord=ordenOpciones(p);
  var pos=function(k){return ord.indexOf(k)+1};
  var ops=ord.map(function(k,j){
    var cls='opt',o=p.opciones[k-1];
    if(r!=null){if(k===p.correcta)cls+=' ok';else if(k===r)cls+=' bad';else cls+=' dim'}
    return '<button class="'+cls+'" data-a="resp" data-k="'+k+'"'+(r!=null?' disabled':'')+'><span class="num">'+(j+1)+'</span><span>'+esc(o)+'</span></button>';
  }).join('');
  var fb='',acc;
  if(r!=null){
    var ok=r===p.correcta;
    var ex=p.estado==='blanco'?'En el examen la dejaste en blanco.':(p.marcada?'En el examen marcaste «'+p.opciones[p.marcada-1]+'».':'');
    var dom=g.box>=DOMINIO?'Dominada.':'Te faltan '+(DOMINIO-g.box)+' acierto'+(DOMINIO-g.box===1?'':'s')+' seguido'+(DOMINIO-g.box===1?'':'s')+' para dominarla.';
    fb='<div class="fb '+(ok?'ok':'bad')+'"><h3>'+(ok?'Correcto':(r===0?'La correcta es la '+pos(p.correcta):'Incorrecto · la correcta es la '+pos(p.correcta)))+'</h3>'+
      (ex?'<p>'+esc(ex)+'</p>':'')+'<p>'+dom+(!ok?' Volverá a salir en esta sesión.':'')+'</p>'+
      (p.nota?'<div class="nota">'+esc(p.nota)+'</div>':'')+
      (p.dudosa?'<div class="aviso">Transcripción marcada como dudosa: compárala con el original.</div>':'')+'</div>';
    acc='<div class="actions"><button class="btn primary" data-a="sig">'+(sess.i+1>=total?'Ver resumen':'Siguiente')+'</button></div>';
  }else{
    acc='<div class="actions"><button class="btn" data-a="nose">No lo sé</button></div>';
  }
  return '<div class="sesbar"><span>'+Math.min(sess.i+1,total)+' / '+total+'</span><div class="bar"><i style="width:'+Math.round(100*hecho/total)+'%"></i></div><button class="link" data-a="fin">Terminar</button></div>'+
    '<article class="card"><div class="meta"><span class="chip">'+esc(p.examen)+'</span><span class="chip">Nº '+p.n+'</span><span class="chip">'+esc(p.asignatura)+'</span>'+chipEstado(p)+estrella(p)+'</div>'+
    '<p class="enun">'+esc(p.enunciado)+'</p><div class="opts">'+ops+'</div>'+fb+acc+'</article>'+
    '<p class="kbd">Teclado: 1–4 para responder · Enter para seguir</p>';
}

function vResumen(){
  var ids=Object.keys(sess.primero);
  if(!ids.length){sess=null;return vSetup()}
  var ok=ids.filter(function(i){return sess.primero[i]}).length;
  var fall=ids.filter(function(i){return !sess.primero[i]&&db.preguntas[i]});
  var pct=Math.round(100*ok/ids.length);
  var lista=fall.map(function(id){return fila(db.preguntas[id])}).join('');
  return '<section class="card center"><div class="big">'+pct+'%</div><p class="muted">'+ok+' de '+ids.length+' acertadas a la primera</p>'+
    '<div class="actions">'+(fall.length?'<button class="btn primary" data-a="repetir">Repetir falladas ('+fall.length+')</button>':'')+'<button class="btn" data-a="nueva">Nueva sesión</button></div></section>'+
    (fall.length?'<section class="card"><h2>Falladas en esta sesión</h2>'+lista+'</section>':'');
}

function vProgreso(){
  var exs=examenes();if(!exs.length)return vacio();
  if(progEx!=='*'&&exs.indexOf(progEx)<0)progEx='*';
  var delEx=todas().filter(function(p){return progEx==='*'||p.examen===progEx});
  var lista=delEx.filter(principal);
  var arch=delEx.filter(function(p){return p.estado==='correcta'}).sort(function(a,b){return a.examen.localeCompare(b.examen,'es')||a.n-b.n});
  var s=stats(lista),pct=s.intentos?Math.round(100*s.aciertos/s.intentos)+'%':'–';
  var porA={};lista.forEach(function(p){var a=porA[p.asignatura]||(porA[p.asignatura]={t:0,d:0});a.t++;if(dominada(p.id))a.d++});
  var asig=Object.keys(porA).sort(function(a,b){return (porA[a].d/porA[a].t)-(porA[b].d/porA[b].t)||a.localeCompare(b,'es')}).map(function(n){var v=porA[n];
    return '<div class="subj"><span>'+esc(n)+'</span><span class="muted">'+v.d+' / '+v.t+'</span><div class="bar"><i style="width:'+Math.round(100*v.d/v.t)+'%"></i></div></div>'}).join('');
  var qs=lista.slice();if(progVer==='pendientes')qs=qs.filter(function(p){return !dominada(p.id)});
  qs.sort(function(a,b){return a.examen.localeCompare(b.examen,'es')||a.n-b.n});
  var rows='',last=null,multi=progEx==='*'&&exs.length>1;
  qs.forEach(function(p){
    if(multi&&p.examen!==last){rows+='<div class="grp">'+esc(p.examen)+'</div>';last=p.examen}
    rows+=fila(p);
  });
  if(!rows)rows='<p class="hint">No queda nada pendiente aquí.</p>';
  var archH='<section class="card archivo"><details'+(archAbierto?' open':'')+' id="arch"><summary>Acertadas en el examen · '+arch.length+'</summary>'+
    '<p class="hint">Guardadas aparte; no salen en los repasos de errores. Marca ★ Relevante las que acertaste de chiripa y pasarán a la lista principal.</p>'+
    (arch.length?arch.map(fila).join(''):'<p class="hint">No hay acertadas importadas.</p>')+'</details></section>';
  return (exs.length>1?'<section class="card"><label>Examen<select id="progEx">'+opt('*','Todos',progEx)+exs.map(function(e){return opt(e,e,progEx)}).join('')+'</select></label></section>':'')+
    '<section class="card"><div class="stats four">'+
      '<div class="stat"><b>'+s.total+'</b><span>Errores y relevantes</span></div>'+
      '<div class="stat"><b>'+s.pend+'</b><span>Pendientes</span></div>'+
      '<div class="stat"><b>'+s.dom+'</b><span>Dominadas</span></div>'+
      '<div class="stat"><b>'+pct+'</b><span>Acierto en práctica</span></div></div></section>'+
    '<section class="card"><h2>Por asignatura</h2>'+asig+'<p class="hint">Barra = preguntas dominadas. Las asignaturas más flojas, arriba.</p></section>'+
    '<section class="card"><h2>Preguntas</h2><div class="seg"><button class="'+(progVer==='pendientes'?'on':'')+'" data-a="ver" data-v="pendientes">Pendientes</button><button class="'+(progVer==='todas'?'on':'')+'" data-a="ver" data-v="todas">Todas</button></div>'+rows+
    '<p class="hint">Toca una pregunta para practicarla sola.</p></section>'+archH;
}

function vDatos(){
  var exs=examenes();
  var exH=exs.length?exs.map(function(ex){var l=todas().filter(function(p){return p.examen===ex}),d=l.filter(function(p){return dominada(p.id)}).length;
    return '<div class="exrow"><div><b>'+esc(ex)+'</b><span class="hint">'+l.length+' preguntas · '+d+' dominadas</span></div><div class="exbtns"><button class="btn small" data-a="reset" data-ex="'+esc(ex)+'">Reiniciar progreso</button><button class="btn small danger" data-a="borrar" data-ex="'+esc(ex)+'">Eliminar</button></div></div>'}).join('')
    :'<p class="hint">Todavía no hay exámenes.</p>';
  var res='';
  if(ultimoImport){
    var u=ultimoImport;
    if(u.error)res='<div class="res err">'+esc(u.error)+'</div>';
    else res='<div class="res"><b>'+u.nuevas+' nuevas · '+u.actualizadas+' actualizadas</b>'+
      (u.revisar.length?'<div class="aviso">Revisa a mano con el original: '+u.revisar.map(esc).join(', ')+'</div>':'')+
      (u.errores.length?'<ul>'+u.errores.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ul>':'')+'</div>';
  }
  return '<section class="card"><h2>Añadir preguntas desde fotos</h2><ol class="steps">'+
      '<li>Copia el prompt y pégalo en Claude junto con las fotos del examen corregido (mejor 2–4 fotos por mensaje).</li>'+
      '<li>Pega aquí el JSON que te devuelva y pulsa <b>Importar</b>. Puedes ir por tandas: si el nombre del examen es el mismo, se suman y el progreso se conserva.</li></ol>'+
      '<div class="btnrow"><button class="btn" data-a="copiar">Copiar prompt</button></div>'+
      '<details><summary>Ver prompt</summary><pre class="prompt">'+esc(PROMPT)+'</pre></details>'+
      '<label>JSON de preguntas o copia de seguridad<textarea id="imp" spellcheck="false" placeholder=\'{"examen": "...", "preguntas": [ ... ]}\'></textarea></label>'+
      '<div class="btnrow"><button class="btn primary" data-a="importar">Importar</button><button class="btn" data-a="archivo">Cargar archivo .json</button><input type="file" id="file" accept=".json,application/json,text/plain" hidden></div>'+res+
    '</section>'+
    '<section class="card"><h2>Compartir la app con las preguntas</h2><p class="hint" style="margin-top:0">Las preguntas que importas se guardan en este navegador, no en el archivo. Este botón genera un HTML nuevo con todas las preguntas dentro (sin tu progreso), listo para pasárselo a otra persona o abrirlo en otro dispositivo.</p>'+
      '<div class="btnrow"><button class="btn" data-a="appconpreg">Descargar app con las preguntas</button></div></section>'+
    '<section class="card"><h2>Copia de seguridad</h2><p class="hint" style="margin-top:0">El progreso se guarda solo en este navegador. Para no perderlo o pasarlo a otro dispositivo, exporta una copia y luego impórtala allí con el cuadro de arriba.</p>'+
      '<div class="btnrow"><button class="btn" data-a="exportar">Exportar copia (.json)</button></div></section>'+
    '<section class="card"><h2>Exámenes cargados</h2>'+exH+'</section>';
}

function render(){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.v===vista)});
  var h=storageOK?'':'<div class="banner">Este navegador no deja guardar datos (¿modo privado?). El progreso se perderá al cerrar: exporta una copia en Datos.</div>';
  if(vista==='practicar')h+=sess?(sess.fin?vResumen():vPregunta()):vSetup();
  else if(vista==='progreso')h+=vProgreso();
  else h+=vDatos();
  $('#app').innerHTML=h;
  var ta=$('#imp');if(ta)ta.value=impTxt;
}

/* ---------- Acciones ---------- */
function doImport(txt){
  try{var r=importar(extraerJSON(txt));guardar();ultimoImport=r;if(r.nuevas+r.actualizadas>0){impTxt='';toast('Importadas: '+r.nuevas+' nuevas, '+r.actualizadas+' actualizadas')}}
  catch(e){ultimoImport={error:e.message}}
  render();
}
function descargar(txt,nombre,tipo){
  var blob=new Blob([txt],{type:tipo});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);
}
var hoy=function(){return new Date().toISOString().slice(0,10)};
function exportar(){
  var data={tipo:'repaso-fir-copia',version:1,exportado:new Date().toISOString(),db:{preguntas:db.preguntas,progreso:db.progreso}};
  descargar(JSON.stringify(data),'repaso-fir-copia-'+hoy()+'.json','application/json');
}
function descargarApp(){
  var porEx={};
  todas().forEach(function(p){
    var e=porEx[p.examen]||(porEx[p.examen]={examen:p.examen,fecha:p.fecha||undefined,preguntas:[]});
    var q={n:p.n,asignatura:p.asignatura,enunciado:p.enunciado,opciones:p.opciones,correcta:p.correcta,marcada:p.marcada,estado:p.estado};
    if(p.nota)q.nota=p.nota;if(p.dudosa)q.dudosa=true;if(prog(p.id).relevante)q.relevante=true;
    e.preguntas.push(q);
  });
  var data=Object.keys(porEx).map(function(k){porEx[k].preguntas.sort(function(a,b){return a.n-b.n});return porEx[k]});
  if(!data.length){toast('No hay preguntas que incluir');return}
  var json=JSON.stringify(data,null,1).replace(/</g,'\\u003c');
  var html=ORIGINAL.replace(/(<script type="application\/json" id="datos-incrustados">)[\s\S]*?(<\/script>)/,function(_,a,b){return a+'\n'+json+'\n'+b});
  descargar(html,'repaso-fir-'+hoy()+'.html','text/html');
}
function copiar(txt){
  function plan(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Prompt copiado')}catch(e){toast('No se pudo copiar: ábrelo en «Ver prompt»')}ta.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('Prompt copiado')},plan);else plan();
}
function idsDe(ex){return todas().filter(function(p){return p.examen===ex}).map(function(p){return p.id})}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a;
  switch(a){
    case 'go':vista=b.dataset.v;render();window.scrollTo(0,0);break;
    case 'empezar':var l=ordenar(filtrar(db.cfg),db.cfg.orden);if(db.cfg.tam>0)l=l.slice(0,db.cfg.tam);empezar(l.map(function(p){return p.id}));break;
    case 'resp':responder(parseInt(b.dataset.k,10));break;
    case 'nose':responder(0);break;
    case 'sig':siguiente();break;
    case 'fin':if(sess){sess.fin=true;render()}break;
    case 'nueva':sess=null;render();break;
    case 'repetir':empezar(Object.keys(sess.primero).filter(function(i){return !sess.primero[i]}));break;
    case 'una':empezar([b.dataset.id]);break;
    case 'ver':progVer=b.dataset.v;render();break;
    case 'copiar':copiar(PROMPT);break;
    case 'importar':impTxt=$('#imp').value;doImport(impTxt);break;
    case 'archivo':$('#file').click();break;
    case 'exportar':exportar();break;
    case 'appconpreg':descargarApp();break;
    case 'rel':var g=prog(b.dataset.id);g.relevante=!g.relevante;guardar();render();toast(g.relevante?'Añadida a la lista principal':'Devuelta al archivo de acertadas');break;
    case 'reset':
      if(confirm('¿Reiniciar el progreso de «'+b.dataset.ex+'»? Las preguntas se mantienen.')){idsDe(b.dataset.ex).forEach(function(id){var rel=prog(id).relevante;db.progreso[id]=nuevoProg();if(rel)db.progreso[id].relevante=true});guardar();render();toast('Progreso reiniciado')}
      break;
    case 'borrar':
      if(confirm('¿Eliminar «'+b.dataset.ex+'» y todo su progreso?')){idsDe(b.dataset.ex).forEach(function(id){delete db.preguntas[id];delete db.progreso[id]});sess=null;guardar();render();toast('Examen eliminado')}
      break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.cfg){var k=t.dataset.cfg;db.cfg[k]=k==='tam'?parseInt(t.value,10):t.value;if(k==='examen')db.cfg.asig='*';guardar();render();return}
  if(t.id==='progEx'){progEx=t.value;render();return}
  if(t.id==='file'&&t.files&&t.files[0]){var fr=new FileReader();fr.onload=function(){impTxt=String(fr.result);doImport(impTxt)};fr.readAsText(t.files[0])}
});
document.addEventListener('toggle',function(e){if(e.target.id==='arch')archAbierto=e.target.open},true);
document.addEventListener('input',function(e){if(e.target.id==='imp')impTxt=e.target.value});
document.addEventListener('keydown',function(e){
  if(e.target.closest&&e.target.closest('textarea,input,select'))return;
  if(e.target.classList&&e.target.classList.contains('qrow')&&e.key==='Enter'){e.target.click();return}
  if(vista!=='practicar'||!sess||sess.fin)return;
  if(sess.resp==null){var p=db.preguntas[sess.cola[sess.i]],k=parseInt(e.key,10);if(p&&k>=1&&k<=p.opciones.length){e.preventDefault();responder(ordenOpciones(p)[k-1])}}
  else if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();siguiente()}
});

render();
})();
</script>
</body>
</html>
